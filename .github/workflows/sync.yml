name: Sync Zoho -> Supabase

# Auto-actualizacion del pipeline: trae los tickets nuevos/modificados de Zoho
# Desk hacia Supabase. El dashboard (Supabase Realtime) se refresca solo.
#
# El cron automatico se movio a Supabase (pg_cron + pg_net, ver migracion
# 0060_zoho_kommo_cron.sql): jobs "zoho-sync-incremental" y
# "zoho-kommo-push-safety", cada 5 min, corriendo la MISMA logica (zoho-sync +
# zoho-kommo-push como Edge Functions) sin depender de que este repo tenga un
# runner disponible. Se desactivo el schedule de acá para no correr la
# automatizacion dos veces en paralelo — el workflow_dispatch queda como
# respaldo manual (ej. un full-sync puntual).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sync'
        type: choice
        options: [incremental, full, enrich, kommo, meta]
        default: incremental

concurrency:
  group: zoho-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sincronizar
        working-directory: sync
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
          ZOHO_DEPARTMENT_ID: ${{ secrets.ZOHO_DEPARTMENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Kommo CRM: el modo incremental crea los leads de los tickets nuevos
          # en la misma corrida. Sin estas credenciales, ese paso se omite.
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
          KOMMO_LONG_LIVED_TOKEN: ${{ secrets.KOMMO_LONG_LIVED_TOKEN }}
        run: node sync.mjs ${{ github.event.inputs.mode || 'incremental' }}
